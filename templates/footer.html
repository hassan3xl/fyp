<script>
  // Active link highlighting with Tailwind CSS classes
  (function() {
    const currentPath = window.location.pathname;
    let activeId = null;
    if (currentPath.includes("/dashboard/")) {
      activeId = "nav-dashboard";
    } else if (currentPath.includes("/products/")) {
      activeId = "nav-products";
    } else if (currentPath.includes("/categories/")) {
      activeId = "nav-categories";
    } else if (currentPath.includes("/sales/new/")) {
      activeId = "nav-new-sale";
    } else if (currentPath.includes("/sales/")) {
      activeId = "nav-sales";
    }
    
    if (activeId) {
      const el = document.getElementById(activeId);
      if (el) {
        el.classList.add("bg-emerald-50", "text-[#1b4332]", "font-semibold");
        el.classList.remove("text-slate-600");
        const icon = el.querySelector("i");
        if (icon) {
          icon.classList.remove("text-slate-400");
          icon.classList.add("text-[#1b4332]");
        }
      }
    }
  })();
</script>
